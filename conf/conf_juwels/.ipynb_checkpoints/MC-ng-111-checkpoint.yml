runner:
    ctrl_max_amp    :  0.064
    ctrl_min_amp    : -0.064
    action_noise    :  0.1
    npl_state       :  2
    ckpt_int        :  1

    if_eval          : True
    eval_freq        : 2

    nb_episodes        : 100
    nb_warmup_episodes : 1
    nb_interactions : 2500
    train_steps     : 300
    gradient_steps  : 64

    RL_algorithm    : "TD3"
    rescale_actions : True
    learning_rate   : 1e-3
    batch_size      : 256
    buffer_size     : 5_000_000
    learning_starts : 100
    tau             : 0.005
    policy_delay    : 2


    policy_file     : '../conf/default_ddpg_policy.yml'
    policy          : 'best_model'
    load_agent      :  False
    normalize_input : 'utau'

    custom_buffer : False
    keep_frac     : 0.25
    buffer_mode   : 'rotate'

    seed            : 199810

    random_init     : 6
    rank            : 1
    agent_run_name  : 20011

    evaluation      : False
    learnt_policy   : True

    u_tau           : 0.064
    dUdy            : 11.75 

    # Net-gain reward — full: drag reduction + pressure-velocity + kinetic energy costs
    reward_fn       : net_gain
    reward_alpha    : 1.0
    reward_beta     : 1.0
    reward_gamma    : 1.0


simulation:
    CASENAME : "phill"
    exeName : 'nek5000'
    compile_path   : "../envs/cases/mini_channel"
    restart_folder : "../data/restarts/rs6_mini_Channel"
    TOTCTRL : 220
    nproc   : 32
    ndrl    : 10
    znmf_avg: 1
    target_cfl: 2.0
    retau : 182.0
    y_sensing : 15.0
    gll_unique : 1

    out_log : 'logfile'
    lx1       :  6
    Lx        :  2.67
    Ly        :  1.0
    Lz        :  0.8
    Nx        :  4
    Ny        :  16
    Nz        :  4
    nxs       :  1
    nzs       :  1

    stopAt : "numSteps"
    numSteps : 50000000
    dt       : -5.0e-03
    tmax     : 10000000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep'
    writeInterval : 100_000_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    stressFormulation  :  "no"
    variableProperties  :  "no"
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2900
    advection       :  "yes"

    PARFWRITE :  "no"
    PARFNAME  :  "outparfile"
    LOGLEVEL  :  1
    WALLTIME  :  "23:45"
    READCHKPT     :  "yes"
    CHKPFNUMBER   :  1
    CHKPINTERVAL  :  10000000
    AVSTEP     :  10
    IOSTEP     :  300_000_000
    SMPSTEP : 100_000_000
