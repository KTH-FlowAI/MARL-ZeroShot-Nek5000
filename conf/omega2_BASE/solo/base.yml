#!/usr/bin/env python3
# Embedded (Nek-solo) evaluation for omega2_BASE -- Re_tau = 280, mesh lc_n7.
#
#   ./execs/nek-solo-run.sh --config conf/omega2_BASE/solo/base.yml
#
# Budget: 5000 control cycles = 125000 solver steps, shared by
# every case in this folder so the four records are directly comparable.
#
# Uniform blowing at ZERO intensity: the wall is restored to plain
# no-slip while the control, sampling and recording path stays identical
# to the DRL case.

embedded:
    enabled: true
    net_precision: 8
    analytic_policy: 'BL'
    u_tau: [1.0]
    ctrl_max_amp: [0.0]      # zero blowing == plain no-slip wall
    rec_freq: 10
    rec_bufsize: 500
    resume: false
    coupled_recorder: true

runner:
    RL_algorithm      : 'BL'
    normalize_input   : 'None'    # the analytic law consumes raw (u', v')
    rescale_actions   : false
    ctrl_min_amp      : -1.0
    ctrl_max_amp      : 1.0
    npl_state         : 2
    u_tau             : 0.061    # physical reference; the export scale is in embedded
    dUdy              : 16.9

    nb_interactions   : 5000
    random_init       : 6
    rank              : 1
    agent_run_name    : 'lc_omega2_SS_base_solonek'
    load_agent        : false
    learnt_policy     : false
    evaluation        : true

    reward_fn         : 'net_gain'
    reward_alpha      : 1.0
    reward_beta       : 1.0
    reward_gamma      : 1.0

simulation:
    CASENAME          : 'tcf'
    solver_version    : 'v19'
    exeName           : 'nek5000_solo'
    compile_path      : 'envs/cases/lc_n7'
    restart_folder    : 'data/restarts/rs6_lc_noresize_new_reth515'
    shared_data_path  : 'data/simulations/large_channel'
    shared_data_link  : true

    TOTCTRL           : 128    # be consistent with SIZE
    nproc             : 512
    ndrl              : 25
    znmf_avg          : 0
    target_cfl        : 2.0
    retau             : 280.0
    y_sensing         : 15.0
    nzs               : 1
    nxs               : 1
    gll_unique        : 0
    ys_bdf            : 0.0
    amp_bdf           : 0.0
    ret_bdf           : 0.0
    out_log           : 'logfile'

    #------------------------------------------
    # tsrs interpolation mesh: Nx*lx1 x Nz*lx1 points per plane,
    # matching the solver GLL count. y_planes are in wall units and
    # are shared by every case in this folder.
    #------------------------------------------
    lx1               : 8
    Lx                : 6.28
    Ly                : 1.0
    Lz                : 3.14
    Nx                : 10
    Ny                : 8
    Nz                : 9
    y_planes          : [0,3,5,8,10,12,15,20,23,26,30,40,50,75,100,150,200,250]

    #--------------------------
    # .par file
    #--------------------------
    stopAt            : 'numSteps'
    numSteps          : 125000    # nb_interactions * ndrl of the DRL case
    dt                : -2.0e-03
    tmax              : 100000.0
    timeStepper       : 'bdf3'
    variableDt        : 'no'
    writeControl      : 'timeStep'
    writeInterval     : 200000000
    dealiasing        : 'yes'
    filtering         : 'none'
    filterWeight      : 0.01
    filterCutoffRatio : 0.9
    stressFormulation : 'no'
    variableProperties: 'no'
    p_residualTol     : 1e-8
    p_residualProj    : 'no'
    v_residualTol     : 1e-8
    v_residualProj    : 'no'
    density           : 1.0
    viscosity         : -4600
    advection         : 'yes'

    PARFWRITE         : 'no'
    PARFNAME          : 'outparfile'
    LOGLEVEL          : 1
    WALLTIME          : '23:45'
    READCHKPT         : 'yes'
    CHKPFNUMBER       : 1
    CHKPINTERVAL      : 20000    # the run spans several jobs; needed by --resume
    AVSTEP            : 10
    IOSTEP            : 10000
    SMPSTEP           : 25    # time-series sampling on the DRL control cadence
