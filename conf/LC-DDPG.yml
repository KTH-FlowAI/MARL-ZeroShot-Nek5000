#!/usr/bin/env python3
# -*- coding: utf-8 -*-
runner: 
    ctrl_max_amp    :  0.0633        # The alpha
    ctrl_min_amp    : -0.0633        # The alpha
    action_noise    :  0.00633 
    npl_state       :  2
    ckpt_int        :  5

    nb_episodes     : 200
    nb_interactions : 2541          # Time steps in 1 episode t^+ = 1500  steps = nb_interact * ndrl 
    train_steps     : 300
    gradient_steps  : 64      # For each training step, how many times we extract the off-policy history from the history buffer with batch size?
   
    RL_algorithm    : "DDPG"
    rescale_actions : True
    learning_rate   : 1e-3
    batch_size      : 256        # Since we have more envs, this should be sufficiently large
    buffer_size     : 5_000_000
    learning_starts : 100
    tau             : 0.005
    
    policy_file     : 'conf/default_ddpg_policy.yml'
    policy          : 'rl_model_111804000_steps'
    load_agent      :  True
    normalize_input : 'utau'   # Between None, utau, std, maxmin
    
    random_init     : -1
    rank            : 1          # Which initial contion to use
    agent_run_name  : 199832
    
    evaluation      : True
    learnt_policy   : True

    u_tau           : 0.0633
    dUdy            : 11.2



simulation: 
    CASENAME : "tcf"
    #I/O
    exeName : 'nek5000'
    compile_path   : "../envs/cases/mid_channel"
    restart_folder : "../data/rs6_ret180"
    #------------------------------------------
    # Generally VERY IMPORTANT
    TOTCTRL : 49       # Be consistent with SIZE
    nproc   : 512         # ranks for running
    ndrl    : 25             # Steps to update the rewards (t^+=0.6)
    znmf_avg: 1           # NEK(1 == open, 0=close,) -1== Naive Average 
    target_cfl: 2.0           # NEK(1 == open, 0=close,) -1== Naive Average 
    retau : 180.0 
    y_sensing : 15.0 
    #------------------------------------------

    # slurm specific 
    out_log : 'logfile'
    #------------------------
    # SIZE
    #------------------------
    lx1       :  8               # Polynomial Order 
    Lx        :  6.28
    Ly        :  1.0
    Lz        :  3.14   # Size of domain 
    Nx        :  4
    Ny        :  16
    Nz        :  4         # No. Spectral Elements    
    #--------------------------
    # .par file 
    #--------------------------
    ### General 
    stopAt : "numSteps"
    numSteps : 500000       # Make it a bit longer so that the simulation not stops
    dt       : -2.0e-03
    tmax     : 100000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep' #runTime
    writeInterval : 20_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    #[PROBLEMTYPE]
    stressFormulation  :  "no"
    variableProperties  :  "no"
    #[PRESSURE]
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    #[VELOCITY]
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2800
    advection       :  "yes"
    
    #[_RUNPAR]               # Runtime parameter section for rprm module
    PARFWRITE :  "no"          # Do we write runtime parameter file
    PARFNAME  :  "outparfile"  # Runtime parameter file name for output (without .par)
    
    #[_MONITOR]              # Runtime parameter section for monitor module
    LOGLEVEL  :  1             # Logging threshold for toolboxes
    WALLTIME  :  "23:45"       # Simulation wall time
    
    #[_CHKPOINT]             # Runtime paramere section for checkpoint module
    READCHKPT     :  "yes"     # Restat from checkpoint
    CHKPFNUMBER   :  1         # Restart file number
    CHKPINTERVAL  :  10000000      # Checkpiont saving frequency (number of time steps)

    #[_STAT]             # Runtime paramere section for statistics module
    AVSTEP     :  10
    IOSTEP     :  20_000