#!/usr/bin/env python3
# -*- coding: utf-8 -*-
runner: 
    ctrl_max_amp    :  1.0 # The alpha
    ctrl_min_amp    :  -1.0
    npl_state       :  2
    ckpt_int        :  5
    nb_interactions :  1000
    RL_algorithm    : "OC"
    rescale_actions : False
    load_agent      :  False
    normalize_input : 'None'   # Between None, utau, std, maxmin
    
    random_init     : -1
    rank            : 1          # Which initial contion to use
    agent_run_name  : "oc-mc-dr"
    
    evaluation      : True
    learnt_policy   : False # Since AFC doesn't need to train, so here is False

    u_tau           : 0.065
    dUdy            : 11.91
    reward_fn  : dudy # PowerSaving, DragReduction, AFC


simulation: 
    CASENAME : "phill"
    #I/O
    exeName : 'nek5000'
    compile_path   : "envs/cases/mini_channel"
    restart_folder : "data/restarts/rs6_mini_Channel"
    #------------------------------------------
    # Generally VERY IMPORTANT
    TOTCTRL : 220        # Be consistent with SIZE
    nproc   : 10         
    ndrl    : 1          # Steps to update the rewards (t^+=0.6)
    znmf_avg: 0         # NEK(1 == open, 0=close,) -1== Naive Average 
    target_cfl: 2.0           # NEK(1 == open, 0=close,) -1== Naive Average 
    retau : 180.0 
    y_sensing : 15.0
    gll_unique : 0 
    #------------------------------------------

    # slurm specific 
    out_log : 'logfile'
    #------------------------
    # SIZE
    #------------------------
    lx1       :  6               # Polynomial Order 
    Lx        :  2.67 
    Ly        :  1.0
    Lz        :  0.8  # Size of domain 
    Nx        :  4
    Ny        :  16
    Nz        :  4         # No. Spectral Elements    
    #--------------------------
    # .par file 
    #--------------------------
    ### General 
    stopAt : "numSteps"
    numSteps : 500000       # Make it a bit longer so that the simulation not stops
    dt       : -5.0e-03
    tmax     : 100000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep' #runTime
    writeInterval : 10000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    #[PROBLEMTYPE]
    stressFormulation  :  "no"
    variableProperties  :  "no"
    #[PRESSURE]
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    #[VELOCITY]
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2900
    advection       :  "yes"
    
    #[_RUNPAR]               # Runtime parameter section for rprm module
    PARFWRITE :  "no"          # Do we write runtime parameter file
    PARFNAME  :  "outparfile"  # Runtime parameter file name for output (without .par)
    
    #[_MONITOR]              # Runtime parameter section for monitor module
    LOGLEVEL  :  1             # Logging threshold for toolboxes
    WALLTIME  :  "23:45"       # Simulation wall time
    
    #[_CHKPOINT]             # Runtime paramere section for checkpoint module
    READCHKPT     :  "yes"     # Restat from checkpoint
    CHKPFNUMBER   :  1         # Restart file number
    CHKPINTERVAL  :  10000000      # Checkpiont saving frequency (number of time steps)

    #[_STAT]             # Runtime paramere section for statistics module
    AVSTEP     :  10
    IOSTEP     :  300_000_000

    #[_TSRS]
    SMPSTEP : 23  # How many steps to sample the time series? 
