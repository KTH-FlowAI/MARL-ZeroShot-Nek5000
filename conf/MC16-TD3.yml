#!/usr/bin/env python3
# -*- coding: utf-8 -*-
runner: 
    ctrl_max_amp    :  0.0638       # The alpha
    ctrl_min_amp    : -0.0638      # The alpha
    action_noise    :  0.1
    npl_state       :  2
    ckpt_int        :  5

    nb_episodes        : 20
    nb_warmup_episodes : 1
    nb_interactions : 2540        # Time steps in 1 episode t^+ = 1500  steps = nb_interact * ndrl 
    train_steps     : 300
    gradient_steps  : 64      # For each training step, how many times we extract the off-policy history from the history buffer with batch size?
   
    RL_algorithm    : "TD3"
    rescale_actions : True
    learning_rate   : 1e-3
    batch_size      : 256        # Since we have more envs, this should be sufficiently large
    buffer_size     : 5_000_000
    learning_starts : 100
    tau             : 0.005
    policy_delay    : 2
    target_policy_noise : 0.0
    target_noise_clip : 0.0

    policy_file     : '../conf/default_ddpg_policy.yml'
    policy          : 'rl_model_9144000_steps'
    load_agent      :  False
    normalize_input : 'utau'   # Between None, utau, std, maxmin
    
    # Custom buffer
    custom_buffer : False   
    keep_frac     : 0.25
    buffer_mode   : 'rotate'
    
    seed            : 1998
    
    random_init     : 6
    rank            : 1          # Which initial contion to use
    agent_run_name  : 1998
    
    evaluation      : False
    learnt_policy   : False

    u_tau           : 0.0638
    dUdy            : 12.4271


    

simulation: 
    CASENAME : "phill"
    #I/O
    exeName : 'nek5000'
    compile_path   : "../envs/cases/mini_channel"
    restart_folder : "../data/restarts/rs6_mini_Channel"
    #------------------------------------------
    # Generally VERY IMPORTANT
    TOTCTRL : 220        # Be consistent with SIZE
    nproc   : 10         
    ndrl    : 6          # Steps to update the rewards (t^+=0.6)
    znmf_avg: 1           # NEK(1 == open, 0=close,) -1== Naive Average 
    target_cfl: 2.0           # NEK(1 == open, 0=close,) -1== Naive Average 
    retau : 180.0 
    y_sensing : 15.0
    #------------------------------------------

    # slurm specific 
    out_log : 'logfile'
    #------------------------
    # SIZE
    #------------------------
    lx1       :  6               # Polynomial Order 
    Lx        :  2.67 
    Ly        :  1.0
    Lz        :  0.8  # Size of domain 
    Nx        :  4
    Ny        :  16
    Nz        :  4         # No. Spectral Elements    
    nxs       :  1
    nzs       :  1
    #--------------------------
    # .par file 
    #--------------------------
    ### General 
    stopAt : "numSteps"
    numSteps : 500000       # Make it a bit longer so that the simulation not stops
    dt       : -1.0e-2
    tmax     : 100000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep' #runTime
    writeInterval : 100_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    #[PROBLEMTYPE]
    stressFormulation  :  "no"
    variableProperties  :  "no"
    #[PRESSURE]
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    #[VELOCITY]
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2800
    advection       :  "yes"
    
    #[_RUNPAR]               # Runtime parameter section for rprm module
    PARFWRITE :  "no"          # Do we write runtime parameter file
    PARFNAME  :  "outparfile"  # Runtime parameter file name for output (without .par)
    
    #[_MONITOR]              # Runtime parameter section for monitor module
    LOGLEVEL  :  1             # Logging threshold for toolboxes
    WALLTIME  :  "23:45"       # Simulation wall time
    
    #[_CHKPOINT]             # Runtime paramere section for checkpoint module
    READCHKPT     :  "yes"     # Restat from checkpoint
    CHKPFNUMBER   :  1         # Restart file number
    CHKPINTERVAL  :  10000000      # Checkpiont saving frequency (number of time steps)

    #[_STAT]             # Runtime paramere section for statistics module
    AVSTEP     :  10
    IOSTEP     :  300_000_000

    #[_TSRS]
    SMPSTEP : 23  # How many steps to sample the time series? 
