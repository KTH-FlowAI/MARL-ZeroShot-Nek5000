runner:
    ctrl_max_amp    :  0.064
    ctrl_min_amp    : -0.064
    npl_state       :  2
    ckpt_int        :  1

    if_eval          : True
    eval_freq        : 2

    nb_episodes        : 100
    nb_warmup_episodes : 1
    nb_interactions : 2500
    train_steps     : 300
    gradient_steps  : 64

    # ---- SAC (max-entropy off-policy) ----
    RL_algorithm    : "SAC"
    rescale_actions : True                          # REQUIRED: gives SAC a symmetric [-1,1] action space
    learning_rate   : 1e-3
    batch_size      : 256
    buffer_size     : 5_000_000
    learning_starts : 100
    tau             : 0.005
    gamma           : 0.99

    # SAC entropy control.
    #   sac_ent_coef='auto' -> the temperature alpha is auto-tuned to hold the
    #   policy entropy AT sac_target_entropy (below). We fix the *target*, not alpha.
    #
    #   Action is 1-D and tanh-bounded to [-1,1]:
    #     * 'auto' target would be -dim(A) = -1.0  (~ pre-tanh std 0.10, bang-bang risk)
    #     * uniform-on-[-1,1] entropy is ln(2) = +0.69   (max possible)
    #     * log_std_init=-2.3 in the policy file starts the policy at H ~ -0.88
    #   -0.5 corresponds to pre-tanh std ~0.15: slightly MORE spread than init,
    #   which keeps the actuation off the +/-1 rails while still converging.
    #   Nudge toward 0 for more exploration, toward -1 for more decisive control.
    sac_ent_coef        : 'auto'
    sac_target_entropy  :  "auto"
    target_update_interval : 1
    #[TUNE] External Gaussian action noise ON TOP of SAC's entropy-driven
    #[TUNE] exploration. sigma is `action_noise`, applied in the rescaled [-1,1]
    #[TUNE] action space (0.1 == the TD3 baseline; ~0.0064 physical after
    #[TUNE] ctrl_max_amp scaling). Unusual for SAC and adds exploration -- lower
    #[TUNE] the sigma, or set the flag back to False, if the policy stays too noisy.
    sac_action_noise    : True
    action_noise        : 0.1

    policy_file     : 'conf/default_sac_policy.yml'
    policy          : 'best_model'
    load_agent      :  False                        # fresh SAC run: no prior checkpoint.
                                                    # Flip to True (+ set `policy`) to resume.
    normalize_input : 'utau'

    custom_buffer : False
    keep_frac     : 0.25
    buffer_mode   : 'rotate'

    seed            : 199810

    random_init     : 6
    rank            : 1
    # fresh SAC run id (the TD3 baseline used 20011).
    # NOTE: keep the value line below comment-free -- the launcher greps this key
    # and does not strip inline '#' comments (they would corrupt the path lookup).
    agent_run_name  : "mc_nes_sac"

    evaluation      : False
    learnt_policy   : True

    u_tau           : 0.064
    dUdy            : 11.75

    # Net-gain reward — full: drag reduction + pressure-velocity + kinetic energy costs
    reward_fn       : net_gain
    reward_alpha    : 1.0
    reward_beta     : 1.0
    reward_gamma    : 1.0


simulation:
    CASENAME : "phill"
    exeName : 'nek5000'
    compile_path   : "envs/cases/mini_channel"
    restart_folder : "data/restarts/rs6_mini_Channel"
    TOTCTRL : 220
    nproc   : 10
    ndrl    : 10
    znmf_avg: 1
    target_cfl: 2.0
    retau : 182.0
    y_sensing : 15.0
    gll_unique : 1

    out_log : 'logfile'
    lx1       :  6
    Lx        :  2.67
    Ly        :  1.0
    Lz        :  0.8
    Nx        :  4
    Ny        :  16
    Nz        :  4
    nxs       :  1
    nzs       :  1

    stopAt : "numSteps"
    numSteps : 50000000
    dt       : -5.0e-03
    tmax     : 10000000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep'
    writeInterval : 100_000_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    stressFormulation  :  "no"
    variableProperties  :  "no"
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2900
    advection       :  "yes"

    PARFWRITE :  "no"
    PARFNAME  :  "outparfile"
    LOGLEVEL  :  1
    WALLTIME  :  "23:45"
    READCHKPT     :  "yes"
    CHKPFNUMBER   :  1
    CHKPINTERVAL  :  10000000
    AVSTEP     :  100_000
    IOSTEP     :  300_000_000
    SMPSTEP : 100_000_000
