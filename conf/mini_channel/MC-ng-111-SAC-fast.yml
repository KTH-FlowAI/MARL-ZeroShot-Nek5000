runner:
    ctrl_max_amp    :  0.064
    ctrl_min_amp    : -0.064
    npl_state       :  2
    ckpt_int        :  1

    if_eval          : True
    eval_freq        : 2

    nb_episodes        : 100
    nb_warmup_episodes : 1
    nb_interactions : 2500
    train_steps     : 300
    #[TUNE] Replay ratio was 64 updates / 300 collected steps ~= 0.21 per
    #[TUNE] vectorized step (far lower per transition, since each control step
    #[TUNE] adds nAgents transitions). SAC wants ~1. The Nek solver dominates
    #[TUNE] wall-clock, so more gradient steps are ~free. 300 -> ratio ~= 1:1.
    #[TUNE] Push to ~512 for a more aggressive ~1.7:1; do NOT use -1 (= 300*nAgents).
    gradient_steps  : 300

    # ---- SAC (max-entropy off-policy) ----
    RL_algorithm    : "SAC"
    rescale_actions : True
    learning_rate   : 1e-3       # if the critic loss diverges with the higher
                                 # gradient count, drop to 3e-4
    batch_size      : 256
    buffer_size     : 5_000_000
    learning_starts : 100        # NOT a bottleneck: training is gated by the
                                 # 300-step rollout, so the first update already
                                 # sees 300*nAgents diverse transitions.
    tau             : 0.005
    gamma           : 0.99

    # SAC entropy control.
    #[TUNE] -0.5 (baseline) keeps more exploration to avoid bang-bang, but that
    #[TUNE] SLOWS early convergence. -1.0 (= -dim(A), the SB3 heuristic) lets the
    #[TUNE] policy commit sooner. Watch the action histogram for saturation at +/-1;
    #[TUNE] if it goes bang-bang, move back toward -0.7/-0.5.
    sac_ent_coef        : 'auto'
    sac_target_entropy  : "auto"
    target_update_interval : 1
    #[TUNE] External Gaussian action noise ON TOP of SAC's entropy-driven
    #[TUNE] exploration. `sac_action_noise: True` keeps a NormalActionNoise whose
    #[TUNE] sigma is `action_noise`, applied in the rescaled [-1,1] action space
    #[TUNE] (0.1 == the TD3 baseline; ~0.0064 physical after ctrl_max_amp scaling).
    #[TUNE] Unusual for SAC and adds exploration that can slow convergence -- lower
    #[TUNE] the sigma, or set the flag back to False, if the policy stays too noisy.
    sac_action_noise    : True
    action_noise        : 0.1

    policy_file     : 'conf/default_sac_policy.yml'
    policy          : 'best_model'
    load_agent      :  False
    normalize_input : 'utau'

    custom_buffer : False
    keep_frac     : 0.25
    buffer_mode   : 'rotate'

    seed            : 199810

    random_init     : 6
    rank            : 1
    # tuned SAC variant (baseline run id was mc_nes_sac)
    agent_run_name  : "mc_nes_sac_fast"

    evaluation      : False
    learnt_policy   : True

    u_tau           : 0.064
    dUdy            : 11.75

    # Net-gain reward — full: drag reduction + pressure-velocity + kinetic energy costs
    reward_fn       : net_gain
    reward_alpha    : 1.0
    reward_beta     : 1.0
    reward_gamma    : 1.0


simulation:
    CASENAME : "phill"
    exeName : 'nek5000'
    compile_path   : "envs/cases/mini_channel"
    restart_folder : "data/restarts/rs6_mini_Channel"
    TOTCTRL : 220
    nproc   : 10
    ndrl    : 10
    znmf_avg: 1
    target_cfl: 2.0
    retau : 182.0
    y_sensing : 15.0
    gll_unique : 1

    out_log : 'logfile'
    lx1       :  6
    Lx        :  2.67
    Ly        :  1.0
    Lz        :  0.8
    Nx        :  4
    Ny        :  16
    Nz        :  4
    nxs       :  1
    nzs       :  1

    stopAt : "numSteps"
    numSteps : 50000000
    dt       : -5.0e-03
    tmax     : 10000000.0
    timeStepper : "bdf3"
    variableDt : "no"
    writeControl : 'timeStep'
    writeInterval : 100_000_000
    dealiasing : "yes"
    filtering : "none"
    filterWeight : 0.01
    filterCutoffRatio : 0.9
    stressFormulation  :  "no"
    variableProperties  :  "no"
    p_residualTol   :  1e-8
    p_residualProj  :  "no"
    v_residualTol   :  1e-8
    v_residualProj  :  "no"
    density         :  1.0
    viscosity       :  -2900
    advection       :  "yes"

    PARFWRITE :  "no"
    PARFNAME  :  "outparfile"
    LOGLEVEL  :  1
    WALLTIME  :  "23:45"
    READCHKPT     :  "yes"
    CHKPFNUMBER   :  1
    CHKPINTERVAL  :  10000000
    AVSTEP     :  100_000
    IOSTEP     :  300_000_000
    SMPSTEP : 100_000_000
